<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1a35">
<title>صَنعة | SANAAH</title>
<style>
:root{--navy:#0c1a35;--navy2:#16294f;--gold:#d4a23a;--gold2:#f0c767;--bg:#f8f4ea;--card:#fff;--ink:#13203d;--mute:#5f6a80;--line:#e6dfcf;--wa:#1faa59;--err:#b3261e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1327;--card:#13213f;--ink:#f1ece0;--mute:#a9b3c7;--line:#26365a}}
:root[data-theme="dark"]{--bg:#0a1327;--card:#13213f;--ink:#f1ece0;--mute:#a9b3c7;--line:#26365a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;scroll-behavior:auto!important}}

/* top bar */
.bar{position:fixed;top:0;inset-inline:0;z-index:40;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff;transition:background .3s}
.bar.solid{background:rgba(12,26,53,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{font-size:23px;font-weight:800;margin-inline-end:auto}.logo b{color:var(--gold)}
.tb{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.tb.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.tb.ic{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:19px}

/* hero */
.hero{position:relative;min-height:100svh;background:var(--navy);color:#fff;display:flex;flex-direction:column;overflow:hidden}
.slides{position:absolute;inset:0}
.sl{position:absolute;inset:0;opacity:0;transition:opacity 1.3s ease;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(78px + env(safe-area-inset-top,0px))}
.sl.on{opacity:1}
.sl .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) brightness(.5) saturate(1.2)}
.sl img{position:relative;display:block;width:auto;height:auto;max-width:calc(100% - 28px);max-height:min(42svh,380px);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.18)}
.sl.on img{animation:fl 9s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-6px) scale(1.025)}}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(12,26,53,.85) 72%,var(--navy) 100%);pointer-events:none}
.copy{position:relative;margin-top:auto;padding:24px 22px calc(26px + env(safe-area-inset-bottom,0px));max-width:680px}
.now{display:inline-block;margin-bottom:10px;padding:6px 15px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:14px;opacity:0;transition:opacity .5s}.now.in{opacity:1}.now b{color:var(--gold2)}
.copy h1{font-size:clamp(30px,8.5vw,54px);line-height:1.2;margin:0 0 8px;font-weight:800}
.copy p{color:#d3dbec;margin:0 0 18px;font-size:16px}
.go{background:var(--gold);color:var(--navy);border:0;border-radius:14px;padding:15px 26px;font-weight:800;font-size:17px;width:100%;max-width:340px;box-shadow:0 8px 24px rgba(212,162,58,.35)}
.go:active{transform:scale(.97)}
.dots{display:flex;gap:5px;margin-top:16px}.dots i{width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);transition:.4s}.dots i.on{background:var(--gold);width:32px}

/* sections */
.sec{padding:42px 18px 8px;max-width:760px;margin:0 auto;scroll-margin-top:64px}
.sec h2{font-size:25px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 18px}
.st{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold2);font-weight:800;font-size:15px;margin-inline-end:8px;vertical-align:middle}
.trades{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.trade{position:relative;aspect-ratio:1/1.1;border:0;padding:0;border-radius:20px;overflow:hidden;background:var(--navy);color:#fff;box-shadow:0 8px 22px rgba(19,32,61,.18);opacity:0;transform:translateY(22px);transition:opacity .6s,transform .6s,box-shadow .25s}
.trade.in{opacity:1;transform:none}.trade.in:active{transform:scale(.96);transition-duration:.12s}
.trade .ph{position:absolute;inset:0;background-size:cover;background-position:center;display:grid;place-items:center;background-color:var(--navy2);font-size:54px}
.trade::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 45%,rgba(12,26,53,.93))}
.trade .tx{position:absolute;z-index:2;bottom:12px;inset-inline:12px;text-align:start}
.trade b{display:block;font-size:17px}.trade small{color:#d6deef;font-size:12.5px}
.trade[aria-pressed=true]{box-shadow:0 0 0 3px var(--gold),0 12px 28px rgba(212,162,58,.4)}
.trade[aria-pressed=true]::after{content:"✓";position:absolute;z-index:3;top:10px;inset-inline-start:10px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:14px}
.reveal{display:none}.reveal.on{display:block;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-18px;padding:2px 18px 10px;scroll-snap-type:x proximity;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:99px;padding:12px 20px;font-size:15px}
.chip[aria-pressed=true]{background:var(--navy);color:var(--gold2);border-color:var(--navy)}
.list{display:grid;gap:14px;padding-bottom:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 6px 20px rgba(19,32,61,.07);animation:rise .45s both}
.who{display:flex;gap:14px;align-items:center}
.av{flex:none;width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,var(--gold),var(--gold2));color:var(--navy);display:grid;place-items:center;font-size:24px;font-weight:800}
.who h3{margin:0;font-size:19px}.meta{color:var(--mute);font-size:13.5px}
.tag{font-size:11.5px;padding:1px 9px;border-radius:99px;background:#f3e6c4;color:#7a5a12;margin-inline-start:6px}
.desc{margin:12px 0 14px;color:var(--mute);font-size:15.5px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts a{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 8px;border-radius:13px;font-weight:700;text-decoration:none;font-size:16px;color:#fff}
.acts a:active{transform:scale(.97)}.wa{background:var(--wa)}.call{background:var(--navy2)}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:26px 18px;text-align:center;color:var(--mute)}
.empty button{margin-top:10px;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:10px 18px}
.sk{height:150px;border-radius:20px;background:linear-gradient(90deg,var(--line) 25%,var(--card) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1s infinite}@keyframes sh{to{background-position:-200% 0}}
.note{max-width:760px;margin:0 auto;padding:0 18px 30px;color:var(--mute);font-size:13px}
footer{background:var(--navy);color:#b9c4dc;text-align:center;padding:24px;font-size:14px}footer b{color:var(--gold)}

/* modals / settings sheet */
.modal{position:fixed;inset:0;z-index:60;background:rgba(6,12,28,.65);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.box{background:var(--card);color:var(--ink);width:100%;max-width:520px;max-height:92svh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:600px){.modal{align-items:center}.box{border-radius:24px}}
.box h2{margin:0 0 14px;font-size:22px}
.grp{margin-bottom:18px}.grp>span{display:block;font-weight:700;margin-bottom:8px;font-size:15px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:11px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--gold2);border-color:var(--navy)}
.f{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink);direction:ltr;text-align:start}
.f[aria-invalid=true]{border-color:var(--err)}
.msg{font-size:13.5px;margin:6px 0 12px;min-height:1.5em}.msg.err{color:var(--err)}.msg.ok{color:#1e7a4a}
.cta2{width:100%;background:var(--gold);color:var(--navy);border:0;border-radius:13px;padding:14px;font-weight:800;font-size:16px}
.x{width:100%;margin-top:10px;background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:13px;padding:12px}
.lbl{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
.info{background:rgba(212,162,58,.14);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}

.tb[hidden]{display:none}
.tb.acct{display:flex;align-items:center;gap:8px;max-width:52vw;padding:5px 12px 5px 6px}
.tb.acct span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;max-width:34vw}
.av2,.av3{flex:none;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,var(--gold),var(--gold2));color:var(--navy);font-weight:800}
.av2{width:28px;height:28px;font-size:14px}
.av3{width:52px;height:52px;font-size:22px}
.accrow{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.accem{font-weight:700;word-break:break-all;direction:ltr;text-align:start}
.accrole{color:var(--mute);font-size:14px}
</style>
</head>
<body>

<header class="bar" id="bar">
  <span class="logo">صَنعة<b> .</b></span>
  <button class="tb" id="bLogin" data-i="login"></button>
  <button class="tb gold" id="bPro" data-i="pro"></button>
  <button class="tb acct" id="bAcc" hidden aria-label="account"><span class="av2" id="bAccAv"></span><span id="bAccTxt"></span></button>
  <button class="tb ic" id="bSet" aria-label="settings">⚙️</button>
</header>

<div class="hero">
  <div class="slides" id="slides" aria-hidden="true"></div>
  <div class="fade"></div>
  <div class="copy">
    <div class="now" id="now"></div>
    <h1 data-i="h1"></h1>
    <p data-i="h1p"></p>
    <button class="go" id="start" data-i="start"></button>
    <div class="dots" id="dots"></div>
  </div>
</div>

<section class="sec" id="s1">
  <h2><span class="st">1</span><span data-i="t1"></span></h2><p class="sub" data-i="t1s"></p>
  <div class="trades" id="trades"></div>
</section>
<section class="sec reveal" id="s2">
  <h2><span class="st">2</span><span data-i="t2"></span></h2><p class="sub" id="s2sub"></p>
  <div class="chips" id="govs"></div>
</section>
<section class="sec reveal" id="s3">
  <h2><span class="st">3</span><span data-i="t3"></span></h2><p class="sub" id="s3sub"></p>
  <div class="list" id="list"></div>
</section>
<p class="note" data-i="note"></p>
<footer><b>صَنعة</b> · <span data-i="foot"></span></footer>

<!-- settings -->
<div class="modal" id="mSet" role="dialog" aria-modal="true"><div class="box">
  <h2 data-i="set"></h2>
  <div class="grp"><span data-i="s_lang"></span><div class="seg" id="gLang"><button data-v="ar">العربية</button><button data-v="en">English</button></div></div>
  <div class="grp"><span data-i="s_theme"></span><div class="seg" id="gTheme"><button data-v="auto" data-i="auto"></button><button data-v="light" data-i="light"></button><button data-v="dark" data-i="dark"></button></div></div>
  <div class="grp"><span data-i="s_font"></span><div class="seg" id="gFont"><button data-v="0.9" style="font-size:13px">أ</button><button data-v="1" style="font-size:16px">أ</button><button data-v="1.15" style="font-size:19px">أ</button><button data-v="1.3" style="font-size:23px">أ</button></div></div>
  <div class="grp"><span data-i="s_motion"></span><div class="seg" id="gMotion"><button data-v="0" data-i="on"></button><button data-v="1" data-i="off"></button></div></div>
  <button class="cta2" id="sDone" data-i="done"></button>
  <button class="x" id="sReset" data-i="reset"></button>
</div></div>

<!-- account -->
<div class="modal" id="mAcc" role="dialog" aria-modal="true"><div class="box">
  <h2 data-i="acc"></h2>
  <div class="accrow"><span class="av3" id="accAv"></span><div><div class="accem" id="accEm"></div><div class="accrole" id="accRole"></div></div></div>
  <button class="cta2" id="accSet" data-i="toset"></button>
  <button class="x" id="accOut" data-i="out"></button>
  <button class="x" data-close data-i="close"></button>
</div></div>

<!-- login -->
<div class="modal" id="mLog" role="dialog" aria-modal="true"><div class="box">
  <h2 id="lt"></h2>
  <div class="info" data-i="authnote"></div>
  <label class="lbl" for="em" data-i="email"></label>
  <input class="f" id="em" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
  <label class="lbl" for="pw" style="margin-top:12px" data-i="pass"></label>
  <input class="f" id="pw" type="password" autocomplete="current-password">
  <div id="otpBox" hidden><label class="lbl" for="otp" style="margin-top:12px" data-i="code"></label><input class="f" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456"><button class="cta2" id="vbtn" style="margin-top:10px" data-i="verify"></button></div>
  <div class="msg" id="pm" role="alert"></div>
  <button class="cta2" id="lgo" data-i="signin"></button>
  <button class="x" id="sup" data-i="signup"></button>
  <button class="x" data-close data-i="close"></button>
</div></div>

msg:"Hello {n}, I found you on SANAAH and need {t} service."}};

const $=id=>document.getElementById(id),D={lang:"ar",theme:"auto",fz:"1",rm:"0"};
try{Object.assign(D,JSON.parse(localStorage.getItem("cfg")||"{}"))}catch(e){}
const L=()=>D.lang==="ar"?0:1,t=k=>S[D.lang][k];
let selT=null,selG=-1,mode="c";

function apply(){
  const h=document.documentElement;
  h.lang=D.lang;h.dir=D.lang==="ar"?"rtl":"ltr";
  if(D.theme==="auto")h.removeAttribute("data-theme");else h.dataset.theme=D.theme;
  h.classList.toggle("rm",D.rm==="1");
  document.querySelectorAll(".sec,.note,footer,.box,.copy").forEach(e=>e.style.zoom=D.fz);
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  [["gLang","lang"],["gTheme","theme"],["gFont","fz"],["gMotion","rm"]].forEach(([g,k])=>$(g).querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===D[k])));
  try{localStorage.setItem("cfg",JSON.stringify(D))}catch(e){}
  nowTxt();renderTrades();if(typeof renderAcc==="function")renderAcc();
  if(selT){govChips();workers(false)}
}

/* hero */
const HERO=["carp","smith","elec","ac","paint","plumb","car","alum","move","clean","sat"],POS={};
const sl=$("slides"),dt=$("dots");
HERO.forEach((k,i)=>{sl.insertAdjacentHTML("beforeend",`<div class="sl${i?"":" on"}"><div class="bg" style="background-image:url(${IMG[k]})"></div><img src="${IMG[k]}" alt="" decoding="async"></div>`);dt.insertAdjacentHTML("beforeend",`<i class="${i?"":"on"}"></i>`)});
const sls=[...sl.children],dts=[...dt.children];let cur=0,tm;
const nowTxt=()=>{const r=TR.find(x=>x[0]===HERO[cur]);$("now").innerHTML=`<b>${r[2+L()]}</b> · ${r[4+L()]}`;$("now").classList.add("in")};
function show(n){sls[cur].classList.remove("on");dts[cur].classList.remove("on");cur=(n+sls.length)%sls.length;sls[cur].classList.add("on");dts[cur].classList.add("on");$("now").classList.remove("in");setTimeout(nowTxt,350)}
const play=()=>{clearInterval(tm);tm=setInterval(()=>show(cur+1),5200)};
play();document.addEventListener("visibilitychange",()=>document.hidden?clearInterval(tm):play());
let sx=null;const hero=document.querySelector(".hero");
hero.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
hero.addEventListener("touchend",e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>45){show(cur+(d<0?1:-1));play()}});
dt.addEventListener("click",e=>{const i=dts.indexOf(e.target);if(i>-1){show(i);play()}});
addEventListener("scroll",()=>$("bar").classList.toggle("solid",scrollY>innerHeight*.6),{passive:true});

/* trades / areas / pros */
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12}):null;
function renderTrades(){
  $("trades").innerHTML=TR.map(r=>`<button class="trade" data-id="${r[0]}" aria-pressed="${selT&&selT[0]===r[0]}"><div class="ph" style="${IMG[r[0]]?`background-image:url(${IMG[r[0]]})`:""}">${IMG[r[0]]?"":r[1]}</div><div class="tx"><b>${r[2+L()]}</b><small>${r[4+L()]}</small></div></button>`).join("");
  document.querySelectorAll(".trade").forEach((b,i)=>{b.style.transitionDelay=(i%2)*90+"ms";io?io.observe(b):b.classList.add("in")});
}
const chip=(i,x)=>`<button class="chip" data-g="${i}" aria-pressed="${i===selG}">${x}</button>`;
function govChips(){$("govs").innerHTML=chip(-1,t("all"))+GOV.map((g,i)=>chip(i,g[L()])).join("");$("s2sub").textContent=t("s2")+selT[2+L()]+t("s2e")}
$("trades").addEventListener("click",e=>{const b=e.target.closest(".trade");if(!b)return;
  selT=TR.find(r=>r[0]===b.dataset.id);selG=-1;
  document.querySelectorAll(".trade").forEach(x=>x.setAttribute("aria-pressed",x===b));
  govChips();$("s2").classList.add("on");$("s3").classList.add("on");workers(true);
  setTimeout(()=>$("s2").scrollIntoView({behavior:"smooth"}),80)});
$("govs").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;selG=+b.dataset.g;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.g===selG));workers(true);
  setTimeout(()=>$("s3").scrollIntoView({behavior:"smooth"}),120)});
$("start").onclick=()=>$("s1").scrollIntoView({behavior:"smooth"});
const np=v=>v.replace(/[\s-]/g,""),intl=p=>"962"+np(p).slice(1);
function workers(load){
  const box=$("list"),run=()=>{
    const r=WK.filter(w=>w.t===selT[0]&&(selG<0||w.g===selG));
    $("s3sub").textContent=`${selT[2+L()]} · ${selG<0?t("all"):GOV[selG][L()]} · ${r.length} ${t("cnt")}`;
    if(!r.length){box.innerHTML=`<div class="empty">${t("none")}<br><button id="all">${t("seeall")}</button></div>`;
      $("all").onclick=()=>{selG=-1;govChips();workers(true)};return}
    box.innerHTML=r.map((w,i)=>{const nm=w.n[L()],m=encodeURIComponent(t("msg").replace("{n}",nm).replace("{t}",selT[2+L()]));
      return `<article class="card" style="animation-delay:${i*70}ms"><div class="who"><div class="av" aria-hidden="true">${nm.replace("م. ","").replace("Eng. ","").charAt(0)}</div><div><h3>${nm}<span class="tag">${t("demo")}</span></h3><div class="meta">${selT[2+L()]} · ${GOV[w.g][L()]} · ${w.y} ${t("yrs")} · ${t("unv")}</div></div></div><p class="desc">${selT[6+L()]}</p><div class="acts"><a class="wa" href="https://wa.me/${intl(w.ph)}?text=${m}" target="_blank" rel="noopener">${t("wa")}</a><a class="call" href="tel:${np(w.ph)}">${t("call")}</a></div></article>`}).join("")};
  if(load){box.innerHTML='<div class="sk"></div><div class="sk"></div>';setTimeout(run,320)}else run()}

/* modals */
const open=id=>$(id).classList.add("on"),shut=id=>$(id).classList.remove("on");
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m||e.target.hasAttribute("data-close"))m.classList.remove("on")}));
addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal.on").forEach(m=>m.classList.remove("on"))});
$("bSet").onclick=()=>open("mSet");$("sDone").onclick=()=>shut("mSet");
$("bLogin").onclick=()=>{if(user){sb.auth.signOut();return}mode="c";openLog()};$("bPro").onclick=()=>{mode="p";openLog()};
function openLog(){$("lt").textContent=t(mode==="c"?"lt_c":"lt_p");$("pm").textContent="";$("em").value="";$("pw").value="";$("otpBox").hidden=true;$("otp").value="";open("mLog")}
const bind=(g,k)=>$(g).addEventListener("click",e=>{const b=e.target.closest("button");if(b){D[k]=b.dataset.v;apply()}});
bind("gLang","lang");bind("gTheme","theme");bind("gFont","fz");bind("gMotion","rm");
$("sReset").onclick=()=>{Object.assign(D,{lang:"ar",theme:"auto",fz:"1",rm:"0"});apply()};
const authMsg=(m,c)=>{$("pm").className="msg "+c;$("pm").textContent=m};
async function doAuth(up){
  const em=$("em").value.trim(),pw=$("pw").value;
  if(!/^\S+@\S+\.\S+$/.test(em))return authMsg(t("e_mail"),"err");
  if(pw.length<8)return authMsg(t("e_pass"),"err");
  if(!sb)return authMsg(t("nocfg"),"err");
  $("lgo").disabled=$("sup").disabled=true;
  const r=up?await sb.auth.signUp({email:em,password:pw,options:{data:{role:mode==="p"?"provider":"customer"}}}):await sb.auth.signInWithPassword({email:em,password:pw});
  $("lgo").disabled=$("sup").disabled=false;
  if(r.error)return authMsg(r.error.message,"err");
  if(up&&!r.data.session){pend=em;$("otpBox").hidden=false;$("otp").focus();return authMsg(t("checkc"),"ok")}
  authMsg(t("welcome"),"ok");setTimeout(()=>shut("mLog"),900)
}
$("vbtn").onclick=async()=>{const c=$("otp").value.trim();if(!/^\d{6,8}$/.test(c))return authMsg(t("badc"),"err");if(!sb)return authMsg(t("nocfg"),"err");const r=await sb.auth.verifyOtp({email:pend,token:c,type:"signup"});if(r.error)return authMsg(r.error.message,"err");authMsg(t("welcome"),"ok");$("otpBox").hidden=true;setTimeout(()=>shut("mLog"),900)};
$("lgo").onclick=()=>doAuth(false);$("sup").onclick=()=>doAuth(true);
let urole=null;
function renderAcc(){
  if(!user)return;
  const l=(user.email||"?").charAt(0).toUpperCase();
  $("bAccAv").textContent=$("accAv").textContent=l;
  $("bAccTxt").textContent=$("accEm").textContent=user.email||"";
  $("accRole").textContent=urole?t(urole==="provider"?"role_p":"role_c"):"";
}
async function onUser(s){
  user=s?s.user:null;
  $("bLogin").hidden=$("bPro").hidden=!!user;
  $("bAcc").hidden=!user;
  if(!user){urole=null;return}
  renderAcc();
  try{const r=await sb.from("profiles").select("role").eq("id",user.id).maybeSingle();urole=r.data?r.data.role:null;renderAcc()}catch(e){}
}
$("bAcc").onclick=()=>{renderAcc();open("mAcc")};
$("accSet").onclick=()=>{shut("mAcc");open("mSet")};
$("accOut").onclick=async()=>{await sb.auth.signOut();shut("mAcc")};
if(sb)sb.auth.onAuthStateChange((_e,s)=>{onUser(s)});
apply();
</script>
</body>
