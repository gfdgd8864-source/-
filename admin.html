<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c1a35">
<title>لوحة التحكم | صَنعة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Kufi+Arabic:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c1a35;--navy2:#16294f;--gold:#d4a23a;--gold2:#f0c767;--bg:#f8f4ea;--card:#fff;--ink:#13203d;--mute:#5f6a80;--line:#e6dfcf;--wa:#1faa59;--err:#b3261e;--ok:#177a43;--warn:#b26a00;--fld:#fffdf7}
@media(prefers-color-scheme:dark){:root{--bg:#0a1327;--card:#13213f;--ink:#f1ece0;--mute:#a9b3c7;--line:#26365a;--fld:#0e1a34}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;line-height:1.6}
h1,h2,h3,.logo{font-family:"Noto Kufi Arabic","Tajawal",sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.logo{font-size:21px;font-weight:800;color:#fff;text-decoration:none;margin-inline-end:auto}.logo b{color:var(--gold)}
.pill{font-size:12px;background:rgba(212,162,58,.25);color:var(--gold2);padding:2px 10px;border-radius:99px}
.lnk{background:none;border:0;color:var(--gold2);text-decoration:underline;font-size:13px}
main{max-width:1000px;margin:0 auto;padding:16px 12px 80px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px;text-align:center;max-width:460px;margin:50px auto}
.box h2{margin:0 0 8px}.box p{color:var(--mute);margin:0 0 18px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:1.5px solid #ddd;border-radius:14px;padding:13px 22px;font-weight:800;font-size:16px}
.gbtn svg{width:22px;height:22px}
.big{background:var(--gold);color:var(--navy);border:0;border-radius:14px;padding:14px 22px;font-weight:800;font-size:17px}
.msg{margin-top:12px;font-weight:700;min-height:22px;font-size:14px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(5,1fr)}}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.st b{display:block;font-size:26px;font-family:"Noto Kufi Arabic",sans-serif}.st span{font-size:13px;color:var(--mute)}
.bar{display:grid;gap:10px;margin-bottom:12px}
@media(min-width:700px){.bar{grid-template-columns:1fr 180px 180px}}
.f{width:100%;background:var(--fld);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.f:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,162,58,.25)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tab{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px}
.tab[aria-pressed=true]{background:var(--navy);color:var(--gold2);border-color:var(--navy)}
.p{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.p.sus{border-color:var(--warn);background:linear-gradient(0deg,var(--card),rgba(178,106,0,.07))}
.p.blk{opacity:.75;border-color:var(--err)}
.top{display:flex;gap:12px;align-items:center}
.pic{flex:none;width:64px;height:64px;border-radius:50%;background:var(--navy2);color:var(--gold2);display:grid;place-items:center;font-size:26px;overflow:hidden;border:3px solid var(--gold);cursor:pointer}
.pic img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.sub{color:var(--mute);font-size:13.5px}
.bd{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:1px 9px;margin-inline-end:4px;margin-top:3px}
.b-pub{background:rgba(23,122,67,.15);color:var(--ok)}.b-dr{background:rgba(95,106,128,.18);color:var(--mute)}
.b-ver{background:rgba(212,162,58,.25);color:#7a5a12}.b-blk{background:rgba(179,38,30,.15);color:var(--err)}.b-sus{background:rgba(178,106,0,.18);color:var(--warn)}
.det{margin:10px 0 0;font-size:14px;display:grid;gap:4px}
.det .why{color:var(--warn);font-weight:700}
.det a{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.a{border:1.5px solid var(--navy);background:transparent;color:var(--ink);border-radius:11px;padding:8px 13px;font-weight:700;font-size:14px}
.a.g{background:var(--ok);border-color:var(--ok);color:#fff}
.a.o{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.a.r{background:var(--err);border-color:var(--err);color:#fff}
.a[disabled]{opacity:.5}
.note{width:100%;margin-top:8px}
.empty{text-align:center;color:var(--mute);padding:30px}
.ov{position:fixed;inset:0;background:rgba(8,16,36,.9);display:none;place-items:center;z-index:50;padding:16px}.ov.on{display:grid}
.ov img{max-width:100%;max-height:90vh;border-radius:14px}
.toast{position:fixed;bottom:18px;inset-inline:16px;margin:auto;max-width:420px;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;text-align:center;font-weight:700;z-index:60;opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:none}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">صَنعة<b> .</b></a>
  <span class="pill" id="pill" hidden>مدير</span>
  <button class="lnk" id="out" hidden>خروج</button>
</header>
<main>

<!-- دخول -->
<div class="box" id="gate">
  <h2>لوحة التحكم 🔐</h2>
  <p>هاي الصفحة لصاحب الموقع فقط. سجّل دخول بحساب Google.</p>
  <button class="gbtn" id="gbtn">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    دخول بحساب Google
  </button>
  <div class="msg err" id="gmsg"></div>
</div>

<!-- أول مرة: استلام الملكية -->
<div class="box" id="claim" hidden>
  <h2>أول مرة؟ 👑</h2>
  <p>ما في مدير للموقع لسا. اضغط الزر لتصير أنت صاحب لوحة التحكم. <b>اضغطه مرة وحدة بس وبسرعة</b>، بعدها الباب بينقفل على أي حدا ثاني.</p>
  <button class="big" id="claimBtn">أنا صاحب الموقع</button>
  <div class="msg" id="cmsg"></div>
</div>

<!-- مو مدير -->
<div class="box" id="deny" hidden>
  <h2>ما عندك صلاحية ⛔</h2>
  <p id="denyT">هالحساب مش مدير. سجّل خروج وجرّب بالحساب الصحيح.</p>
</div>

<!-- اللوحة -->
<section id="dash" hidden>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input class="f" id="q" type="search" placeholder="🔎 دوّر بالاسم أو الرقم أو المحل..." autocomplete="off">
    <select class="f" id="fTrade"></select>
    <select class="f" id="fGov"></select>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</section>
</main>

<div class="ov" id="ov"><img id="ovImg" alt=""></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://bkfyazjjmudfbslmmeuj.supabase.co",SB_KEY="sb_publishable_cC7Y-JCKpNtDddVfnIjRcg_FSSV0Osz";
const sb=window.supabase?supabase.createClient(SB_URL,SB_KEY):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TR={carp:["🪚","نجّار"],smith:["🔥","حدّاد ولحّام"],plumb:["🚰","سبّاك"],elec:["⚡","كهربجي"],ac:["❄️","تكييف وتبريد"],paint:["🎨","دهّان وديكور"],alum:["🪟","ألمنيوم وزجاج"],app:["🧺","أجهزة منزلية"],sat:["📡","دش وإنترنت"],clean:["🧹","تنظيف"],move:["🚚","نقل أثاث"],car:["🚗","ميكانيك سيارات"]};
const GOV=["عمّان","إربد","الزرقاء","البلقاء","مادبا","الكرك","الطفيلة","معان","العقبة","المفرق","جرش","عجلون"];
let ALL=[],TAB="all";

const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600)};
const show=id=>["gate","claim","deny","dash"].forEach(x=>$(x).hidden=x!==id);

/* ---------- الدخول ---------- */
$("gbtn").onclick=async()=>{
  if(!sb){$("gmsg").textContent="الربط مع Supabase غير جاهز";return}
  const r=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:"select_account"}}});
  if(r.error)$("gmsg").textContent=r.error.message};
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};

async function boot(session){
  const u=session&&session.user;
  $("out").hidden=!u;
  if(!u){show("gate");return}
  const a=await sb.rpc("is_admin");
  if(a.error){show("deny");$("denyT").textContent="لازم تشغّل ملف setup-all.sql في Supabase أولاً. ("+a.error.message+")";return}
  if(a.data===true){$("pill").hidden=false;show("dash");load();return}
  show("claim")}
$("claimBtn").onclick=async()=>{
  const r=await sb.rpc("claim_admin");
  if(r.error){$("cmsg").className="msg err";$("cmsg").textContent=r.error.message;return}
  if(r.data===true){location.reload();return}
  show("deny");$("denyT").textContent="في مدير مسجّل من قبل، وهالحساب مش هو. سجّل خروج وادخل بحساب المدير."};
if(sb){sb.auth.getSession().then(({data})=>boot(data.session));sb.auth.onAuthStateChange((e)=>{if(e==="SIGNED_IN")sb.auth.getSession().then(({data})=>boot(data.session))})}

/* ---------- تحميل ---------- */
async function load(){
  $("list").innerHTML='<div class="empty">جاري التحميل...</div>';
  const r=await sb.from("provider_profiles").select("*").order("updated_at",{ascending:false}).limit(1000);
  if(r.error){$("list").innerHTML=`<div class="empty" style="color:var(--err)">${esc(r.error.message)}<br>تأكد إنك شغّلت setup-all.sql</div>`;return}
  ALL=(r.data||[]).map(p=>({...p,_s:suspicion(p)}));
  render()}

/* ---------- كشف المشبوه تلقائياً ---------- */
function phonesOf(p){const a=Array.isArray(p.phones)&&p.phones.length?p.phones.map(x=>x.n):[p.phone];return a.filter(Boolean)}
function suspicion(p){
  const w=[],name=(p.full_name||"").trim();
  if(name.length<3)w.push("الاسم قصير جداً");
  if(/^[\d\W_]+$/.test(name))w.push("الاسم أرقام أو رموز");
  if(/(.)\1{3,}/.test(name))w.push("حروف مكررة بالاسم");
  if(/^[a-z]{1,4}$/i.test(name)||/^[qwertyuiopasdfghjklzxcvbnm]{6,}$/i.test(name))w.push("اسم عشوائي");
  if(/[٠-٩\d]{4,}/.test(name))w.push("أرقام داخل الاسم");
  phonesOf(p).forEach(n=>{const d=String(n).replace(/\D/g,"");
    if(/^07(\d)\1{7}$/.test(d)||/^0*7*1234567/.test(d)||/0{6,}/.test(d)||/^0\d(?:12345678|23456789)/.test(d))w.push("رقم وهمي: "+d)});
  if(!phonesOf(p).length)w.push("بدون رقم هاتف");
  if(/https?:\/\/|www\./i.test(p.bio||""))w.push("رابط داخل النبذة");
  if((p.bio||"").length>10&&/(.{3,})\1{3,}/.test(p.bio))w.push("نبذة مكررة");
  if(p.published&&!p.lat&&!p.photo_url)w.push("منشور بدون صورة وبدون موقع");
  return w}

/* ---------- العرض ---------- */
function fillFilters(){
  if($("fTrade").options.length)return;
  $("fTrade").innerHTML='<option value="">كل الصنعات</option>'+Object.entries(TR).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join("");
  $("fGov").innerHTML='<option value="">كل المحافظات</option>'+GOV.map((g,i)=>`<option value="${i}">${g}</option>`).join("")}
function counts(){return{all:ALL.length,pub:ALL.filter(p=>p.published&&!p.blocked).length,dr:ALL.filter(p=>!p.published&&!p.blocked).length,sus:ALL.filter(p=>p._s.length&&!p.blocked).length,blk:ALL.filter(p=>p.blocked).length}}
function render(){
  fillFilters();const c=counts();
  $("stats").innerHTML=[["الكل",c.all],["منشور",c.pub],["مسودة",c.dr],["مشبوه ⚠️",c.sus],["محظور",c.blk]].map(([l,n])=>`<div class="st"><b>${n}</b><span>${l}</span></div>`).join("");
  const T=[["all","الكل",c.all],["sus","⚠️ مشبوه",c.sus],["pub","منشور",c.pub],["dr","مسودة",c.dr],["blk","محظور",c.blk]];
  $("tabs").innerHTML=T.map(t=>`<button class="tab" data-t="${t[0]}" aria-pressed="${TAB===t[0]}">${t[1]} (${t[2]})</button>`).join("");
  const q=$("q").value.trim().toLowerCase().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)),tr=$("fTrade").value,g=$("fGov").value;
  const rows=ALL.filter(p=>{
    if(TAB==="pub"&&!(p.published&&!p.blocked))return false;
    if(TAB==="dr"&&!(!p.published&&!p.blocked))return false;
    if(TAB==="sus"&&!(p._s.length&&!p.blocked))return false;
    if(TAB==="blk"&&!p.blocked)return false;
    if(tr&&p.trade!==tr)return false;
    if(g!==""&&String(p.governorate)!==g)return false;
    if(q){const hay=[p.full_name,p.shop_name,p.shop_address,p.bio,...phonesOf(p)].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true});
  $("list").innerHTML=rows.length?rows.map(card).join(""):'<div class="empty">ما في نتائج</div>'}
function card(p){
  const t=TR[p.trade]||["👷",p.trade||"؟"],ph=phonesOf(p);
  const map=p.lat!=null?`https://www.google.com/maps?q=${p.lat},${p.lng}`:(p.maps_url||"");
  const upd=p.updated_at?new Date(p.updated_at).toLocaleDateString("ar-JO"):"";
  const bd=[p.blocked?'<span class="bd b-blk">محظور</span>':p.published?'<span class="bd b-pub">منشور</span>':'<span class="bd b-dr">مسودة</span>',
    p.verified?'<span class="bd b-ver">✓ موثّق</span>':"",p._s.length?'<span class="bd b-sus">⚠️ مشبوه</span>':""].join("");
  return `<article class="p${p._s.length?" sus":""}${p.blocked?" blk":""}" data-id="${esc(p.user_id)}">
  <div class="top"><div class="pic" data-img="${esc(p.photo_url||"")}">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="" loading="lazy">`:t[0]}</div>
  <div style="min-width:0"><div class="nm">${esc(p.full_name||"(بدون اسم)")}</div>
  <div class="sub">${t[0]} ${esc(t[1])} · ${esc(GOV[p.governorate]||"")} ${p.years!=null?"· "+esc(p.years)+" سنة":""}</div><div>${bd}</div></div></div>
  <div class="det">
   ${p._s.length?`<div class="why">⚠️ ${p._s.map(esc).join(" · ")}</div>`:""}
   ${p.shop_name||p.shop_address?`<div>🏪 ${esc([p.shop_name,p.shop_address].filter(Boolean).join(" — "))}</div>`:""}
   ${ph.length?`<div>📞 ${ph.map(n=>`<a href="tel:${esc(n)}" dir="ltr">${esc(n)}</a>`).join(" &nbsp;|&nbsp; ")}</div>`:""}
   ${map?`<div>📍 <a href="${esc(map)}" target="_blank" rel="noopener">شوف الموقع على الخريطة</a></div>`:'<div style="color:var(--mute)">📍 ما حدد موقع</div>'}
   ${p.bio?`<div style="color:var(--mute)">${esc(p.bio)}</div>`:""}
   ${upd?`<div class="sub">آخر تعديل: ${esc(upd)}</div>`:""}
  </div>
  <input class="f note" data-note placeholder="ملاحظة خاصة فيك (ما حد بشوفها)" value="${esc(p.admin_note||"")}" maxlength="200">
  <div class="acts">
   ${p.blocked?"":`<button class="a ${p.published?"":"g"}" data-a="pub">${p.published?"إخفاء من الموقع":"✅ نشر على الموقع"}</button>`}
   <button class="a o" data-a="ver">${p.verified?"إلغاء التوثيق":"✓ توثيق"}</button>
   <button class="a" data-a="blk">${p.blocked?"فك الحظر":"🚫 حظر"}</button>
   <button class="a r" data-a="del">🗑️ حذف نهائي</button>
  </div></article>`}

/* ---------- الإجراءات ---------- */
$("list").addEventListener("click",async e=>{
  const pic=e.target.closest(".pic");if(pic&&pic.dataset.img){$("ovImg").src=pic.dataset.img;$("ov").classList.add("on");return}
  const b=e.target.closest("[data-a]");if(!b)return;
  const el=b.closest(".p"),id=el.dataset.id,p=ALL.find(x=>x.user_id===id);if(!p)return;
  const a=b.dataset.a;let patch=null;
  if(a==="pub")patch={published:!p.published};
  if(a==="ver")patch={verified:!p.verified};
  if(a==="blk"){if(!p.blocked&&!confirm("حظر "+(p.full_name||"هذا المعلم")+"؟ بينشال من الموقع ولا يقدر ينشر مرة ثانية."))return;patch={blocked:!p.blocked};if(!p.blocked)patch.published=false}
  if(a==="del"){
    if(!confirm("حذف "+(p.full_name||"هذا المعلم")+" نهائياً مع صورته؟ ما في رجعة.\n(إذا بدك تمنعه من التسجيل مرة ثانية استعمل «حظر» بدل الحذف)"))return;
    b.disabled=true;
    await sb.storage.from("provider-photos").remove([id+"/avatar.jpg"]);
    const r=await sb.from("provider_profiles").delete().eq("user_id",id);
    if(r.error){b.disabled=false;toast("فشل: "+r.error.message);return}
    ALL=ALL.filter(x=>x.user_id!==id);render();toast("انحذف ✓");return}
  b.disabled=true;
  const r=await sb.from("provider_profiles").update(patch).eq("user_id",id).select().maybeSingle();
  b.disabled=false;
  if(r.error){toast("فشل: "+r.error.message);return}
  Object.assign(p,patch,r.data||{});p._s=suspicion(p);render();toast("تم ✓")});
$("list").addEventListener("change",async e=>{
  if(!e.target.matches("[data-note]"))return;
  const id=e.target.closest(".p").dataset.id,v=e.target.value.trim()||null;
  const r=await sb.from("provider_profiles").update({admin_note:v}).eq("user_id",id);
  if(r.error)toast("فشل: "+r.error.message);else{const p=ALL.find(x=>x.user_id===id);if(p)p.admin_note=v;toast("انحفظت الملاحظة ✓")}});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b){TAB=b.dataset.t;render()}});
["q","fTrade","fGov"].forEach(i=>$(i).addEventListener("input",render));
